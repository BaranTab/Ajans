<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kadraj — Türkiye Ajans Rehberi</title>
<style>
:root{--bg:#f3f1fb;--tx:#1b1838;--mu:#6b6890;--gl:rgba(255,255,255,.55);--gb:rgba(255,255,255,.8);--sh:0 8px 32px rgba(70,50,140,.14);--a:#6d4aff;--b:#ff5fa2;--c:#22d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b1f;--tx:#f1eeff;--mu:#a29fc6;--gl:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);--sh:0 8px 32px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0d0b1f;--tx:#f1eeff;--mu:#a29fc6;--gl:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);--sh:0 8px 32px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.55;z-index:-1;animation:fl 18s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--a);top:-100px;left:-80px}
.b2{width:360px;height:360px;background:var(--b);top:30%;right:-100px;animation-delay:-6s}
.b3{width:300px;height:300px;background:var(--c);bottom:-80px;left:30%;animation-delay:-11s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.glass{background:var(--gl);border:1px solid var(--gb);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.35);border-radius:22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:12px auto;max-width:1100px;width:calc(100% - 24px);display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 20px;border-radius:999px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-r{display:flex;gap:8px;align-items:center}
button,.btn{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{padding:10px 18px;border-radius:999px;font-weight:600;background:var(--gl);border:1px solid var(--gb);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(109,74,255,.25)}
.btn.pri{background:linear-gradient(120deg,var(--a),var(--b));color:#fff;border-color:transparent}
.btn.pri:hover{box-shadow:0 8px 24px rgba(255,95,162,.45);filter:saturate(1.2)}
main{max-width:1100px;margin:0 auto;padding:0 12px 60px}
#view{animation:in .5s cubic-bezier(.2,.8,.2,1)}
#view.out{opacity:0;transform:translateY(12px);transition:.18s}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.985)}}
h1{font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-2px;margin:36px 0 12px;max-width:760px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);max-width:560px;margin:0 0 24px}
.filters{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}
input,select,textarea{font:inherit;color:var(--tx);width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--gb);background:var(--gl);outline:none;transition:.2s}
select option{color:#111}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(109,74,255,.25)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip{padding:7px 14px;border-radius:999px;background:var(--gl);border:1px solid var(--gb);font-size:14px;transition:.2s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:linear-gradient(120deg,var(--a),var(--b));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{padding:0;overflow:hidden;cursor:pointer;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px) rotateX(2deg);box-shadow:0 18px 44px rgba(109,74,255,.3)}
.cover{height:130px;position:relative;transition:.5s}
.card:hover .cover{filter:saturate(1.4) brightness(1.08)}
.avatar{position:absolute;left:18px;bottom:-22px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;border:2px solid var(--gb);backdrop-filter:blur(10px);background:rgba(0,0,0,.25)}
.cb{padding:32px 18px 18px}
.cb h3{margin:0 0 2px;font-size:19px;letter-spacing:-.3px}
.loc,.mu{color:var(--mu);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;background:rgba(109,74,255,.14);color:var(--a)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#c7b8ff}}
.price{font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.pad{padding:22px}
.pad h2{margin:0 0 12px;font-size:20px;letter-spacing:-.3px}
.port{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pi{height:110px;border-radius:16px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:14px;transition:.35s}
.pi:hover{transform:scale(1.05) rotate(-1deg)}
.list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.list li{padding:10px 14px;border-radius:14px;background:var(--gl);border:1px solid var(--gb)}
form.pad{display:grid;gap:14px}
label{font-size:14px;font-weight:600;display:grid;gap:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks .chip input{display:none}
.empty{text-align:center;padding:48px 20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);padding:12px 22px;transition:.4s;z-index:20}
.toast.show{transform:translate(-50%,0)}
a{color:var(--a);font-weight:600}
.nav-r{flex-wrap:wrap;justify-content:flex-end}
.auth{max-width:440px;margin:40px auto;display:grid;gap:14px}
.auth h2{margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:var(--gl);border:1px solid var(--gb)}
.seg button{padding:10px;border-radius:12px;background:transparent;font-weight:600;transition:.3s}
.seg button.on{background:linear-gradient(120deg,var(--a),var(--b));color:#fff;box-shadow:0 6px 16px rgba(109,74,255,.35)}
.err{color:#e5484d;font-size:14px;min-height:1px}
.who{font-size:14px;padding:6px 12px}
@media(max-width:600px){.btn{padding:8px 12px;font-size:14px}.logo{font-size:17px}.who{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<nav class="glass">
  <span class="logo" onclick="go('#/')">Kadraj</span>
  <div class="nav-r" id="navr"></div>
</nav>
<main><div id="view"></div></main>
<div class="toast glass" id="toast"></div>

<script>
const CATS=["Düğün çekimi","Belgesel","Sosyal medya yönetimi","Reklam filmi","Drone çekimi","Ürün fotoğrafı","Kurumsal tanıtım","Web tasarım"];
const GR=["linear-gradient(135deg,#6d4aff,#ff5fa2)","linear-gradient(135deg,#22d3ee,#6d4aff)","linear-gradient(135deg,#ff9a5f,#ff5fa2)","linear-gradient(135deg,#34d399,#22d3ee)","linear-gradient(135deg,#f472b6,#8b5cf6)","linear-gradient(135deg,#fbbf24,#ef4444)"];
const ILLER="Adana,Adıyaman,Afyonkarahisar,Ağrı,Aksaray,Amasya,Ankara,Antalya,Ardahan,Artvin,Aydın,Balıkesir,Bartın,Batman,Bayburt,Bilecik,Bingöl,Bitlis,Bolu,Burdur,Bursa,Çanakkale,Çankırı,Çorum,Denizli,Diyarbakır,Düzce,Edirne,Elazığ,Erzincan,Erzurum,Eskişehir,Gaziantep,Giresun,Gümüşhane,Hakkari,Hatay,Iğdır,Isparta,İstanbul,İzmir,Kahramanmaraş,Karabük,Karaman,Kars,Kastamonu,Kayseri,Kilis,Kırıkkale,Kırklareli,Kırşehir,Kocaeli,Konya,Kütahya,Malatya,Manisa,Mardin,Mersin,Muğla,Muş,Nevşehir,Niğde,Ordu,Osmaniye,Rize,Sakarya,Samsun,Siirt,Sinop,Sivas,Şanlıurfa,Şırnak,Tekirdağ,Tokat,Trabzon,Tunceli,Uşak,Van,Yalova,Yozgat,Zonguldak".split(",");
const ILCE={"İstanbul":["Kadıköy","Beşiktaş","Üsküdar","Şişli","Beyoğlu","Bakırköy"],"Ankara":["Çankaya","Keçiören","Yenimahalle","Mamak"],"İzmir":["Konak","Bornova","Karşıyaka","Alsancak"],"Karabük":["Merkez","Safranbolu","Eskipazar","Yenice"],"Antalya":["Muratpaşa","Konyaaltı","Alanya","Kaş"],"Bursa":["Nilüfer","Osmangazi","Mudanya"],"Trabzon":["Ortahisar","Akçaabat","Of"]};
const SEED=[
{id:1,ad:"Pixel Atölye",il:"İstanbul",ilce:"Kadıköy",kat:["Reklam filmi","Kurumsal tanıtım","Drone çekimi"],fiyat:15000,acik:"Markalar için hikâye anlatan, 8 yıllık deneyimli prodüksiyon ekibi.",ekip:["Selin Aras — Yönetmen","Kaan Er — Görüntü yönetmeni","Deniz Uslu — Kurgu"],ekipman:["Sony FX6","DJI Inspire 3","Aputure 600d"],port:["Otomotiv spotu","Kafe zinciri tanıtımı","Havacılık belgeseli"],tel:"0212 000 00 01"},
{id:2,ad:"Safran Film",il:"Karabük",ilce:"Safranbolu",kat:["Düğün çekimi","Belgesel","Drone çekimi"],fiyat:6000,acik:"Tarihi dokuda düğün ve belgesel çekimleri. Ekibimiz yerelden.",ekip:["Mert Yıldız — Kurucu","Elif Koç — Fotoğraf"],ekipman:["Canon R5","DJI Mavic 3","Gimbal"],port:["Konak düğünü","Çarşı belgeseli","Kanyon drone"],tel:"0370 000 00 02"},
{id:3,ad:"Mavi Sosyal",il:"İzmir",ilce:"Alsancak",kat:["Sosyal medya yönetimi","Web tasarım"],fiyat:8000,acik:"Yerel işletmeler için içerik, reklam ve topluluk yönetimi.",ekip:["Ayşe Tan — Strateji","Burak Sel — Tasarım"],ekipman:["iPhone stüdyo seti","Işık kutusu"],port:["Restoran büyümesi","Güzellik salonu","E-ticaret"],tel:"0232 000 00 03"},
{id:4,ad:"Kıyı Prodüksiyon",il:"Antalya",ilce:"Muratpaşa",kat:["Düğün çekimi","Reklam filmi","Ürün fotoğrafı"],fiyat:12000,acik:"Sahil düğünleri ve turizm markaları için sinematik çekim.",ekip:["Orhan Gül — Yönetmen","Pınar Ay — Kurgu","Tolga Ak — Asistan"],ekipman:["ARRI Mini","Sigma Cine seti"],port:["Otel kampanyası","Plaj düğünü","Yat tanıtımı"],tel:"0242 000 00 04"},
{id:5,ad:"Başkent Medya",il:"Ankara",ilce:"Çankaya",kat:["Kurumsal tanıtım","Belgesel","Web tasarım"],fiyat:10000,acik:"Kurum ve kamu projeleri için belgesel ve tanıtım filmleri.",ekip:["Ceren Doğan — Yapımcı","Emre Kaya — Görüntü"],ekipman:["Sony FX3","Teleprompter","Ses kayıt seti"],port:["Üniversite tanıtımı","Sanayi belgeseli"],tel:"0312 000 00 05"},
{id:6,ad:"Karadeniz Lens",il:"Trabzon",ilce:"Ortahisar",kat:["Drone çekimi","Ürün fotoğrafı","Düğün çekimi"],fiyat:4500,acik:"Yayla, doğa ve yerel ürün çekimlerinde uzman küçük ekip.",ekip:["Hasan Çelik — Fotoğrafçı"],ekipman:["DJI Air 3","Nikon Z6"],port:["Çay markası","Yayla düğünü"],tel:"0462 000 00 06"}];

let data=[...SEED],f={il:"",ilce:"",max:"",kat:"",q:""};
try{const s=localStorage.getItem("kadraj_ilanlar");if(s)data=[...SEED,...JSON.parse(s)]}catch(e){}
const $=s=>document.querySelector(s),v=$("#view");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tl=n=>Number(n).toLocaleString("tr-TR")+" ₺";
function go(h){if(location.hash===h){route();return}location.hash=h}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}

function list(){
  const r=data.filter(a=>(!f.il||a.il===f.il)&&(!f.ilce||a.ilce===f.ilce)&&(!f.max||a.fiyat<=+f.max)&&(!f.kat||a.kat.includes(f.kat))&&(!f.q||a.ad.toLowerCase().includes(f.q.toLowerCase())));
  $("#res").innerHTML=r.length?r.map((a,i)=>`<div class="card glass" onclick="go('#/ajans/${a.id}')"><div class="cover" style="background:${GR[a.id%6]}"><div class="avatar">${esc(a.ad[0])}</div></div><div class="cb"><h3>${esc(a.ad)}</h3><div class="loc">${esc(a.il)}, ${esc(a.ilce)}</div><div class="tags">${a.kat.map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div><div class="row"><span class="mu">Başlangıç</span><span class="price">${tl(a.fiyat)}</span></div></div></div>`).join(""):`<div class="empty glass" style="grid-column:1/-1"><h3>Sonuç bulunamadı</h3><p class="mu">Filtreleri genişletmeyi dene veya ilçe seçimini kaldır.</p></div>`;
  $("#cnt").textContent=r.length+" ajans listeleniyor";
}
function home(){
  v.innerHTML=`<h1>Bulunduğun şehirdeki <em>doğru ajansı</em> bul.</h1><p class="sub">Türkiye'nin her ilinden prodüksiyon, sosyal medya ve tasarım ajansları. Portfolyolarına bak, doğrudan iletişime geç.</p>
  <div class="filters glass">
    <input id="fq" placeholder="Ajans adı ara" value="${esc(f.q)}">
    <select id="fil"><option value="">Tüm iller</option>${ILLER.map(i=>`<option ${f.il===i?"selected":""}>${i}</option>`).join("")}</select>
    <select id="fic"></select>
    <select id="fmx"><option value="">Her bütçe</option>${[5000,10000,15000,25000].map(p=>`<option value="${p}" ${f.max==p?"selected":""}>${tl(p)} altı</option>`).join("")}</select>
  </div>
  <div class="chips" id="chips"></div><p class="mu" id="cnt"></p><div class="grid" id="res"></div>`;
  const ic=()=>{const l=ILCE[f.il]||[];$("#fic").innerHTML=`<option value="">${l.length?"Tüm ilçeler":"İl seç"}</option>`+l.map(i=>`<option ${f.ilce===i?"selected":""}>${i}</option>`).join("");$("#fic").disabled=!l.length};
  const ch=()=>{$("#chips").innerHTML=["",...CATS].map(k=>`<button class="chip ${f.kat===k?"on":""}" data-k="${esc(k)}">${k||"Tümü"}</button>`).join("");document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{f.kat=b.dataset.k;ch();list()})};
  ic();ch();list();
  $("#fq").oninput=e=>{f.q=e.target.value;list()};
  $("#fil").onchange=e=>{f.il=e.target.value;f.ilce="";ic();list()};
  $("#fic").onchange=e=>{f.ilce=e.target.value;list()};
  $("#fmx").onchange=e=>{f.max=e.target.value;list()};
}
function detail(id){
  const a=data.find(x=>x.id==id);if(!a){go("#/");return}
  v.innerHTML=`<button class="btn" style="margin:20px 0" onclick="go('#/')">← Listeye dön</button>
  <div class="glass" style="overflow:hidden"><div class="cover" style="height:170px;background:${GR[a.id%6]}"><div class="avatar" style="width:64px;height:64px;bottom:-26px">${esc(a.ad[0])}</div></div>
  <div class="pad" style="padding-top:38px"><div class="row" style="flex-wrap:wrap;gap:12px"><div><h2 style="font-size:28px;margin:0">${esc(a.ad)}</h2><div class="loc">${esc(a.il)}, ${esc(a.ilce)}</div></div>${me?`<a class="btn pri" href="tel:${esc(a.tel.replace(/\s/g,""))}" style="text-decoration:none;color:#fff">Ara: ${esc(a.tel)}</a>`:`<button class="btn pri" onclick="role='musteri';go('#/giris')">Telefonu görmek için giriş yap</button>`}</div><p>${esc(a.acik)}</p><div class="tags">${a.kat.map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div><div class="price">Başlangıç fiyatı: ${tl(a.fiyat)}</div></div></div>
  <div class="two" style="margin-top:18px"><div class="glass pad"><h2>Portfolyo</h2><div class="port">${a.port.map((p,i)=>`<div class="pi" style="background:${GR[(a.id+i)%6]}">${esc(p)}</div>`).join("")}</div></div>
  <div style="display:grid;gap:18px"><div class="glass pad"><h2>Ekip</h2><ul class="list">${a.ekip.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="glass pad"><h2>Ekipmanlar</h2><ul class="list">${a.ekipman.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div>`;
}
function form(){
  if(!me||me.rol!=="ajans"){role="ajans";toast(me?"İlan vermek için ajans sahibi hesabı gerekir":"İlan vermek için ajans sahibi olarak üye ol");go(me?"#/":"#/kayit");return}
  v.innerHTML=`<h1 style="font-size:clamp(30px,5vw,48px)">Ajansını <em>ücretsiz</em> tanıt.</h1><p class="sub">Müşteriler seni il, ilçe, kategori ve fiyata göre bulacak.</p>
  <form class="glass pad" id="fm"><label>Ajans adı<input name="ad" required></label>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label>İl<input name="il" list="dl" required></label><label>İlçe<input name="ilce" list="di" required></label></div>
  <datalist id="dl">${ILLER.map(i=>`<option>${i}</option>`).join("")}</datalist><datalist id="di">${Object.values(ILCE).flat().map(i=>`<option>${i}</option>`).join("")}</datalist>
  <label>Başlangıç fiyatı (₺)<input name="fiyat" type="number" min="0" required></label>
  <label>Verdiğin hizmetler<div class="checks">${CATS.map(k=>`<label class="chip"><input type="checkbox" name="kat" value="${k}" onchange="this.parentNode.classList.toggle('on',this.checked)">${k}</label>`).join("")}</div></label>
  <label>Ajansını anlat<textarea name="acik" rows="3"></textarea></label>
  <label>Çalışanlar (her satıra bir kişi)<textarea name="ekip" rows="3" placeholder="Ad Soyad — Görev"></textarea></label>
  <label>Ekipmanlar (virgülle ayır)<input name="ekipman" placeholder="Sony FX3, DJI Mavic 3"></label>
  <label>Portfolyo işleri (virgülle ayır)<input name="port"></label>
  <label>Telefon<input name="tel" required></label>
  <button class="btn pri" type="submit">İlanı yayınla</button></form>`;
  $("#fm").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),L=s=>(d.get(s)||"").split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
    const a={id:Date.now(),ad:d.get("ad"),il:d.get("il"),ilce:d.get("ilce"),fiyat:+d.get("fiyat"),kat:d.getAll("kat"),acik:d.get("acik"),ekip:(d.get("ekip")||"").split("\n").map(x=>x.trim()).filter(Boolean),ekipman:L("ekipman"),port:L("port"),tel:d.get("tel"),sahip:me.id};
    if(!a.kat.length){toast("En az bir hizmet seç");return}
    data.push(a);try{localStorage.setItem("kadraj_ilanlar",JSON.stringify(data.filter(x=>x.id>1e6)))}catch(e){}
    toast("İlan yayınlandı");go("#/ajans/"+a.id)};
}
function route(){
  v.classList.add("out");
  setTimeout(()=>{v.classList.remove("out");v.style.animation="none";void v.offsetWidth;v.style.animation="";
    const h=location.hash;scrollTo(0,0);
    if(h.startsWith("#/ajans/"))detail(h.split("/")[2]);else if(h==="#/ilan-ver")form();else if(h==="#/giris")auth("giris");else if(h==="#/kayit")auth("kayit");else home()},180);
}
let users=[],me=null,role="musteri";
try{users=JSON.parse(localStorage.getItem("kadraj_users")||"[]");const s=localStorage.getItem("kadraj_session");me=users.find(u=>u.id==s)||null}catch(e){}
const saveU=()=>{try{localStorage.setItem("kadraj_users",JSON.stringify(users))}catch(e){}};
async function hash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("kadraj"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(unescape(encodeURIComponent(p)))}}
function nav(){
  $("#navr").innerHTML=`<button class="btn" onclick="go('#/')">Ajanslar</button>`+(me?`${me.rol==="ajans"?`<button class="btn pri" onclick="go('#/ilan-ver')">Ajansını ekle</button>`:""}<span class="chip who">${esc(me.ad)} (${me.rol==="ajans"?"Ajans sahibi":"Müşteri"})</span><button class="btn" onclick="logout()">Çıkış</button>`:`<button class="btn" onclick="go('#/giris')">Giriş yap</button><button class="btn pri" onclick="role='musteri';go('#/kayit')">Üye ol</button>`);
}
function login(u){me=u;try{localStorage.setItem("kadraj_session",u.id)}catch(e){}nav();go(u.rol==="ajans"?"#/ilan-ver":"#/")}
function logout(){me=null;try{localStorage.removeItem("kadraj_session")}catch(e){}nav();go("#/");toast("Çıkış yapıldı")}
function auth(mode){
  if(me){go("#/");return}
  const reg=mode==="kayit";
  v.innerHTML=`<div class="auth glass pad"><h2 style="font-size:26px">${reg?"Üye ol":"Giriş yap"}</h2>
  <div class="seg"><button type="button" data-r="musteri">Müşteri</button><button type="button" data-r="ajans">Ajans sahibi</button></div>
  <p class="mu" id="rd" style="margin:0"></p>
  <form id="af" style="display:grid;gap:14px">${reg?`<label>Ad soyad<input name="ad" required autocomplete="name"></label>`:""}<label>E-posta<input name="email" type="email" required autocomplete="email"></label><label>Şifre<input name="sifre" type="password" minlength="6" required autocomplete="${reg?"new-password":"current-password"}"></label><div class="err" id="er"></div><button class="btn pri" type="submit">${reg?"Üye ol":"Giriş yap"}</button></form>
  <p class="mu" style="margin:0">${reg?`Zaten üye misin? <a href="#/giris">Giriş yap</a>`:`Hesabın yok mu? <a href="#/kayit">Üye ol</a>`}</p></div>`;
  const sync=()=>{document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.r===role));$("#rd").textContent=role==="ajans"?"İlan verir, ajansını ve portfolyonu tanıtırsın.":"Ajansları filtreler, iletişim bilgilerine ulaşırsın."};
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{role=b.dataset.r;sync()});sync();
  $("#af").onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),em=d.get("email").trim().toLowerCase(),h=await hash(d.get("sifre")),err=m=>{$("#er").textContent=m};
    if(reg){if(users.some(u=>u.email===em&&u.rol===role))return err("Bu e-posta ile bu hesap türünde zaten bir üyelik var. Giriş yapmayı dene.");const u={id:Date.now(),ad:d.get("ad").trim(),email:em,h,rol:role};users.push(u);saveU();login(u);toast("Hoş geldin, "+u.ad)}
    else{const u=users.find(u=>u.email===em&&u.rol===role&&u.h===h);if(!u)return err("E-posta, şifre veya hesap türü hatalı.");login(u);toast("Giriş yapıldı")}};
}
nav();addEventListener("hashchange",route);route();
</script>
</body>
</html>
